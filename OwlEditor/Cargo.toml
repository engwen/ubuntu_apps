[workspace]
members = ["owl-core"]
resolver = "2"

[package]
name = "owleditor"
version = "0.1.0"
edition = "2021"
description = "OwlEditor - a Wayland-native large-file text editor (GTK4 + Rust)"
authors = ["owl"]

[dependencies]
owl-core = { path = "owl-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
glib = "0.22"
gio = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
