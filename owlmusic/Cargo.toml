[package]
name = "owlmusic"
version = "0.1.0"
edition = "2021"
description = "owlmusic - 本地音乐播放器 (GTK4 + Rust)"
authors = ["owl"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
glib = "0.22"
gio = "0.22"
lofty = "0.25"
symphonia = { version = "0.5", features = [
    "mp3",
    "flac",
    "ogg",
    "vorbis",
    "aac",
    "isomp4",
    "alac",
    "wav",
    "pcm",
    "adpcm",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
libloading = "0.8"
walkdir = "2.5"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
